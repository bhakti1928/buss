<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | Bus Pass Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #0b1f3a 0%, #152c4e 100%);">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="index.html">
                <i class="fa-solid fa-bus text-primary me-2"></i>Bus Pass Management
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i>Home</a>
                <a href="login.html" class="btn btn-outline-primary btn-sm text-white"><i class="fa-solid fa-user me-1"></i>Student Login</a>
            </div>
        </div>
    </nav>

    <!-- Admin Login Box -->
    <div class="page-container d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 460px;">
            <div class="card card-custom border-0 shadow-lg">
                <div class="card-header-custom text-center p-4" style="background: linear-gradient(135deg, #0b1f3a 0%, #0d6efd 100%);">
                    <div class="d-inline-flex p-3 rounded-circle bg-white text-primary mb-2 shadow-sm">
                        <i class="fa-solid fa-user-shield fa-2x"></i>
                    </div>
                    <h4 class="mb-1 fw-bold text-white">Admin Portal</h4>
                    <p class="mb-0 small text-white-50">Transit Management & Pass Approvals</p>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">

                    <!-- Dynamic Alert Message -->
                    <div id="alertBox" class="alert alert-feedback"></div>

                    <form id="adminLoginForm" novalidate>
                        <!-- Admin Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user-tie"></i></span>
                                <input type="text" class="form-control" id="username" placeholder="Enter admin username" required>
                            </div>
                        </div>

                        <!-- Admin Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter admin password" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="fa-solid fa-shield-halved me-1"></i> Secure Admin Login
                        </button>
                    </form>

                    <!-- Hint for Viva / Testing -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-muted">
                            <i class="fa-solid fa-circle-info me-1 text-primary"></i>
                            Project Demo: <code>admin</code> or <code>ishwari</code> / <code>admin123</code>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application JS -->
    <script src="script.js"></script>
</body>
</html>
