<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Bus Pass Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-bus-simple"></i>
                <span>Bus Pass Management</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-house me-1"></i>Home</a>
                <a href="register.html" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-user-plus me-1"></i>Register</a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="page-container d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 480px;">
            <div class="card card-custom">
                <div class="card-header-custom text-center">
                    <h4 class="mb-1"><i class="fa-solid fa-right-to-bracket me-2"></i>Student Login</h4>
                    <p class="mb-0 small text-white-50">Sign in to apply or check your bus pass status</p>
                </div>
                <div class="card-body p-4 p-md-5">

                    <!-- Dynamic Alert Message -->
                    <div id="alertBox" class="alert alert-feedback"></div>

                    <form id="loginForm" novalidate>
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="student@example.com" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <!-- Login Button -->
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Login to Portal
                        </button>
                    </form>

                    <!-- Links -->
                    <div class="text-center mt-4 pt-2 border-top">
                        <span class="text-muted small">Don't have an account? </span>
                        <a href="register.html" class="fw-semibold text-primary small text-decoration-none">Register here</a>
                    </div>
                    <div class="text-center mt-2">
                        <a href="admin.html" class="text-secondary small text-decoration-none">
                            <i class="fa-solid fa-user-shield me-1"></i>Admin Portal Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application JS -->
    <script src="script.js"></script>
</body>
</html>
