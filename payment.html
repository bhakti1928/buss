<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Payment Gateway | Bus Pass Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-bus-simple"></i>
                <span>Bus Pass Management</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">
                    <i class="fa-solid fa-shield me-1"></i>Demo Payment Portal
                </span>
                <div id="nav-student-info"></div>
            </div>
        </div>
    </nav>

    <!-- Payment Container -->
    <div class="page-container d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 520px;">
            <div class="card card-custom">
                <div class="card-header-custom text-center">
                    <h4 class="mb-1"><i class="fa-solid fa-credit-card me-2"></i>Bus Pass Payment</h4>
                    <p class="mb-0 small text-white-50">Application #BP-<span id="displayPassId">...</span></p>
                </div>
                <div class="card-body p-4 p-md-5">

                    <!-- Fee Summary Box -->
                    <div class="d-flex justify-content-between align-items-center p-3 mb-4 rounded-3 bg-light border">
                        <div>
                            <span class="text-muted small d-block">Total Amount Payable</span>
                            <span class="fw-bold text-dark fs-5">Bus Pass Fee:</span>
                        </div>
                        <div class="text-end">
                            <span class="text-primary fw-bold fs-3">₹300</span>
                        </div>
                    </div>

                    <!-- Dynamic Alert Message -->
                    <div id="alertBox" class="alert alert-feedback"></div>

                    <form id="paymentForm" novalidate>
                        <!-- Card Holder Name -->
                        <div class="mb-3">
                            <label for="cardHolder" class="form-label">Card Holder Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="cardHolder" placeholder="e.g. Rahul Sharma" required>
                            </div>
                        </div>

                        <!-- Card Number -->
                        <div class="mb-3">
                            <label for="cardNumber" class="form-label">Card Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-credit-card"></i></span>
                                <input type="text" class="form-control" id="cardNumber" placeholder="4532 8920 1234 5678" maxlength="19" required>
                            </div>
                        </div>

                        <!-- Expiry Date & CVV -->
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <label for="expiryDate" class="form-label">Expiry Date <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-regular fa-calendar"></i></span>
                                    <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                                </div>
                            </div>
                            <div class="col-6">
                                <label for="cvv" class="form-label">CVV <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" id="cvv" placeholder="123" maxlength="4" required>
                                </div>
                            </div>
                        </div>

                        <!-- Demo Notice -->
                        <div class="alert alert-light border small text-muted text-center py-2 mb-4">
                            <i class="fa-solid fa-circle-check text-success me-1"></i> Simulated College Sandbox Gateway (No real money charged)
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-5">
                            <i class="fa-solid fa-lock me-2"></i>Pay ₹300
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application JS -->
    <script src="script.js"></script>
</body>
</html>
