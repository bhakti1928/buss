<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Bus Pass | Bus Pass Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-bus-simple"></i>
                <span>Bus Pass Management</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="status.html" class="btn btn-outline-primary btn-sm">
                    <i class="fa-solid fa-clock-rotate-left me-1"></i>My Passes
                </a>
                <div id="nav-student-info"></div>
            </div>
        </div>
    </nav>

    <!-- Apply Container -->
    <div class="page-container d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 650px;">
            <div class="card card-custom">
                <div class="card-header-custom d-flex justify-content-between align-items-center">
                    <div>
                        <h4 class="mb-1"><i class="fa-solid fa-ticket me-2"></i>Apply for Bus Pass</h4>
                        <p class="mb-0 small text-white-50">Welcome, <span id="studentDisplayName" class="fw-bold text-white">Student</span></p>
                    </div>
                    <span class="badge bg-white text-primary px-3 py-2 rounded-pill">Fee: ₹300</span>
                </div>
                <div class="card-body p-4 p-md-5">

                    <!-- Dynamic Alert Message -->
                    <div id="alertBox" class="alert alert-feedback"></div>

                    <form id="applyForm" novalidate>
                        <!-- Route Selection: Source & Destination -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="source" class="form-label">Source Stop / Origin <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                    <input type="text" class="form-control" id="source" placeholder="e.g. Shivaji Nagar" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="destination" class="form-label">Destination / College <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-flag-checkered"></i></span>
                                    <input type="text" class="form-control" id="destination" placeholder="e.g. Polytechnic Campus" required>
                                </div>
                            </div>
                        </div>

                        <!-- Pass Type -->
                        <div class="mb-3">
                            <label for="passType" class="form-label">Pass Type <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                                <select class="form-select" id="passType" required>
                                    <option value="Monthly" selected>Monthly Pass (Standard Rate ₹300)</option>
                                    <option value="Quarterly">Quarterly Pass (3 Months Rate ₹800)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Validity Dates -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="startDate" class="form-label">Start Date <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-regular fa-calendar-check"></i></span>
                                    <input type="date" class="form-control" id="startDate" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="endDate" class="form-label">End Date <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-regular fa-calendar-xmark"></i></span>
                                    <input type="date" class="form-control" id="endDate" required>
                                </div>
                            </div>
                        </div>

                        <!-- Fee Notice Alert -->
                        <div class="alert alert-info py-2 px-3 small d-flex align-items-center mb-4">
                            <i class="fa-solid fa-info-circle me-2 fs-5"></i>
                            <span>Application fee payment of <strong>₹300</strong> will be collected in demo mode on the next screen.</span>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="fa-solid fa-arrow-right me-1"></i> Submit & Proceed to Payment
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application JS -->
    <script src="script.js"></script>
</body>
</html>
